reference:
- title: Unified outlier cleaning
  desc: 'One-call entry point — orchestrates the four primitives with the class-aware
    consensus rule (default; user-configurable via `consensus =`), plus topological
    block expansion. Two post-run diagnostics: `mt_diagnose_clean_track()` for cleaning
    health, `mt_diagnose_flags()` for per-detector flag composition + consensus-mode
    comparison.'
  contents:
  - mt_clean_track
  - mt_diagnose_clean_track
  - mt_diagnose_flags
  - v_phys_estimate
- title: Outlier-detection primitives
  desc: The four primitives composed by mt_clean_track(). Run individually for fine-grained
    control.
  contents:
  - mt_flag_outliers_bridge
  - mt_flag_outliers_detour
  - mt_flag_outliers
  - mt_flag_speed_cap
  - mt_suggest_speed_cap
  - mt_peel_speed
- title: Consensus rule (combine per-detector flags)
  desc: Externalised voting/consensus across detector outputs. Used internally by
    mt_clean_track() and exported so users running their own cascades (or running
    the four primitives standalone) can apply the same rules to their own per-detector
    flag columns.
  contents: mt_flag_consensus
- title: State-aware bridge variants (standalone)
  desc: Per-axis bridge motion variance with an envelope flag rule across three Z
    channels. Exported as standalone primitives, not currently wired into mt_clean_track()'s
    cascade.
  contents:
  - mt_flag_outliers_dbgb
  - mt_flag_outliers_dbbmm
- title: Alternative outlier strategies
  desc: Voting / scanning alternatives on the probability surface. See mt_clean_track()'s
    @seealso for when each is the right reach.
  contents:
  - mt_sequential_outliers
  - mt_combined_outliers
- title: Multi-scale persistence annotation
  desc: Detector-agnostic confidence helper that annotates flagged fixes with a persistence
    score across temporal scales.
  contents: mt_persistence_score
- title: Pre-cleaning helpers
  desc: Filter fixes whose GPS geometry is unreliable before running the cleaner.
  contents: mt_filter_gps_quality
- title: Utilisation distributions and motion variance
  desc: Dynamic Brownian-bridge variance estimation, UD computation on a common grid,
    accessors and segment masking for the variance pipeline.
  contents:
  - mt_dbbmm_variance
  - mt_dbbmm_ud
  - mt_dbgb_variance
  - mt_dbgb_ud
  - mt_motion_variance
  - mt_suggest_dbbmm_window
  - ud_volume
  - ud_outer_probability
  - mt_mask_segments
  - emd
- title: Trajectory utilities
  desc: Track segmentation, thinning, corridor detection.
  contents:
  - mt_corridor
  - mt_thin_distance
  - mt_thin_time
- title: S3 print methods
  desc: Internal print formatters for diagnostic objects.
  contents:
  - print.mt_dbbmm_variance
  - print.mt_dbgb_variance
